name: SRE demo incident
description: Structured demo evidence; this form does not authorize or assign Copilot
title: "[SRE][demo] Replace with the canonical incident title"
labels: ["sre-incident", "environment:demo"]
body:
  - type: markdown
    attributes:
      value: |
        Use `python -m scripts.incidents render incident.json` and paste its
        complete output below. Set the title with `scripts.incidents title`.
        Never paste tokens, connection strings, raw request bodies, or log prose.
        Only the exact configured Azure SRE publisher may initiate the handoff;
        a maintainer must verify origin before adding `source:azure-sre-agent`.
        A label alone never assigns Copilot. See docs/incident-response.md.
  - type: textarea
    id: structured-incident
    attributes:
      label: Structured incident
      description: Exact validated marker and JSON fence, without additional instructions
      placeholder: |
        Paste the complete output of python -m scripts.incidents render incident.json
    validations:
      required: true
