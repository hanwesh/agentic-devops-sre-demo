name: SRE Issue Triage

on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing validated demo incident to reconcile
        required: true
        type: number

permissions: {}

concurrency:
  group: sre-handoff-${{ github.repository }}-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handoff:
    name: Validate and assign the demo incident
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'sre-incident')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      # Atomic, immutable launch-intent tags prevent duplicate paid agent work.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository tooling
        run: python -m pip install -r requirements-dev.txt -c requirements.lock
      - name: Re-fetch, validate, and reconcile actual Copilot assignment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_USER_TOKEN: ${{ secrets.COPILOT_USER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          SRE_HANDOFF_ENABLED: ${{ vars.SRE_HANDOFF_ENABLED }}
          COPILOT_POLICY_APPROVED: ${{ vars.COPILOT_POLICY_APPROVED }}
          SRE_ALLOWED_ISSUE_AUTHOR: ${{ vars.SRE_ALLOWED_ISSUE_AUTHOR }}
          SRE_DEMO_APP_INSIGHTS_RESOURCE_ID: ${{ vars.SRE_DEMO_APP_INSIGHTS_RESOURCE_ID }}
        run: python -m scripts.sre_handoff --issue "$ISSUE_NUMBER"
